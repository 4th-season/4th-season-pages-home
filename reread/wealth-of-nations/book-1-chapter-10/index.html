<div class="sitejob-all-head"><h2 class="sitejob-all-title">모든 글 보기<span class="sitejob-all-count">0편</span></h2><div class="sitejob-all-sort" aria-label="글 정렬"><button type="button" data-sitejob-sort="latest" aria-pressed="true">최신순</button><button type="button" data-sitejob-sort="title" aria-pressed="false">가나다순</button></div></div><ul class="sitejob-all-list"></ul>
<script>
(function(){
  var section=document.currentScript &&
    document.currentScript.closest('.sitejob-auto-children');

  if(!section) return;

  var list=section.querySelector('.sitejob-all-list');
  if(!list) return;

  var buttons=section.querySelectorAll('[data-sitejob-sort]');

  function titleValue(el){
    return (el.getAttribute('data-title') || '').trim();
  }

  function dateValue(el){
    return (el.getAttribute('data-date') || '').trim();
  }

  function orderValue(el){
    return parseInt(el.getAttribute('data-order') || '0',10) || 0;
  }

  function koreanCompare(a,b){
    return a.localeCompare(
      b,
      'ko',
      {sensitivity:'base',numeric:true}
    );
  }

  function sort(mode){
    var rows=Array.prototype.slice.call(
      list.querySelectorAll('.sitejob-all-item')
    );

    rows.sort(function(a,b){
      if(mode==='latest'){
        var ad=dateValue(a);
        var bd=dateValue(b);

        if(ad && bd && ad!==bd)
          return bd.localeCompare(ad);

        if(ad && !bd) return -1;
        if(!ad && bd) return 1;

        var ao=orderValue(a);
        var bo=orderValue(b);
        if(ao!==bo) return bo-ao;
      }

      return koreanCompare(
        titleValue(a),
        titleValue(b)
      );
    });

    rows.forEach(function(row){
      list.appendChild(row);
    });

    buttons.forEach(function(btn){
      var active=
        btn.getAttribute('data-sitejob-sort')===mode;

      btn.setAttribute(
        'aria-pressed',
        active ? 'true' : 'false'
      );

      /*
       * currentColor 배경에서도 글자가 사라지지 않도록
       * 활성 버튼의 실제 색상은 JS에서 안전하게 반전하지 않고
       * CSS 변수 대신 명시적 중성 대비를 사용한다.
       */
      if(active){
        btn.style.color='#ffffff';
        btn.style.backgroundColor='#344054';
        btn.style.borderColor='#344054';
      }else{
        btn.style.color='';
        btn.style.backgroundColor='';
        btn.style.borderColor='';
      }
    });
  }

  buttons.forEach(function(btn){
    btn.addEventListener('click',function(){
      sort(
        btn.getAttribute('data-sitejob-sort')
      );
    });
  });

  sort('latest');
})();
</script>
